services:
  - type: web
    name: mac-tg-bot
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: AGENT_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
